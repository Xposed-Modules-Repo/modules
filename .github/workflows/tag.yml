name: Tag
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'repo name'
        required: true
      release:
        description: 'release id'
        required: true
      apk:
        description: 'apk url'
        required: true
      tag:
        description: 'tag name'
        required: true

run-name: Tag ${{ github.event.inputs.repo }}@${{ github.event.inputs.tag }}

concurrency:
  group: ${{ github.event.inputs.repo }}@${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  update_tag:
    runs-on: ubuntu-26.04
    env:
      REPO: ${{ github.event.inputs.repo }}
      RELEASE: ${{ github.event.inputs.release }}
      APK: ${{ github.event.inputs.apk }}
      TAG: ${{ github.event.inputs.tag }}
      TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          version: ^11.27.0
      - run: pnpm start
